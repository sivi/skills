<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{CAMPAIGN_NAME}}</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface-elevated: #16213e;
    --accent: #6c63ff;
    --accent-light: #8b83ff;
    --accent-gradient: linear-gradient(135deg, #6c63ff 0%, #9b5fff 100%);
    --text: #e8e8f0;
    --text-muted: #8888a0;
    --text-dim: #555570;
    --border: rgba(255,255,255,0.06);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 32px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 40px rgba(108,99,255,0.12);
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
  }

  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }

  .meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .meta-pill strong {
    color: var(--text);
    font-weight: 600;
  }

  /* Sections */
  .section {
    margin-bottom: 40px;
  }

  .section-title {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .brief-text {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.7;
  }

  /* Design card */
  .design-group {
    margin-bottom: 48px;
  }

  .design-group-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .design-group-header h3 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }

  .design-group-header .format-badge {
    padding: 4px 12px;
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.75rem;
    color: var(--accent-light);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .design-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }

  @media (min-width: 720px) {
    .design-grid {
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    }

    /* Large-format designs (roughly 700px wide and up) get a full row each,
       so they are not shrunk further than they have to be. The generator
       should add this class to the .design-grid of any such group. */
    .design-grid--wide {
      grid-template-columns: 1fr;
    }
  }

  .design-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .design-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md), var(--shadow-glow);
    border-color: rgba(108,99,255,0.2);
  }

  /* Designs render at their true pixel size when they fit, and scale down
     only when they are wider than the card. Never upscale — a 300x250 ad
     must look like a 300x250 ad. */
  .design-card-image {
    position: relative;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 140px;
    background:
      repeating-conic-gradient(rgba(255,255,255,0.028) 0% 25%, transparent 0% 50%)
      50% / 16px 16px;
  }

  .design-card-image img {
    width: auto;
    max-width: 100%;
    height: auto;
    display: block;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.10), var(--shadow-sm);
  }

  .design-card-body {
    padding: 16px 20px 20px;
  }

  .design-card-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .design-size {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .edit-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    background: var(--accent-gradient);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    border-radius: var(--radius-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 12px rgba(108,99,255,0.3);
  }

  .edit-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(108,99,255,0.5);
    color: #fff;
  }

  .edit-link::after {
    content: "\2197";
    font-size: 0.9rem;
    opacity: 0.8;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 48px 0;
    border: none;
  }

  /* Summary */
  .summary {
    margin-top: 48px;
    padding: 28px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .summary h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text);
  }

  .summary p {
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.7;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .footer a {
    color: var(--accent-light);
    text-decoration: none;
  }

  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>{{CAMPAIGN_NAME}}</h1>
    <div class="meta-bar">
      <span class="meta-pill"><strong>Brand:</strong> {{BRAND_NAME}}</span>
      <span class="meta-pill"><strong>Date:</strong> {{DATE}}</span>
      <span class="meta-pill"><strong>Channels:</strong> {{CHANNELS}}</span>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title">Brief</h2>
    <p class="brief-text">{{BRIEF_TEXT}}</p>
  </div>

  <h2 class="section-title">Designs Created With Sivi</h2>

  <!-- Repeat this design-group block for each channel/format -->
  <div class="design-group">
    <div class="design-group-header">
      <h3>{{CHANNEL_NAME}}</h3>
      <span class="format-badge">{{WIDTH}} x {{HEIGHT}}</span>
    </div>
    <div class="design-grid">

      <!-- Repeat this design-card for each option -->
      <div class="design-card">
        <div class="design-card-image">
          <img src="{{VARIANT_IMAGE_URL}}" alt="{{CHANNEL_NAME}} Option {{OPTION_NUMBER}}">
        </div>
        <div class="design-card-body">
          <div class="design-card-label">Option {{OPTION_NUMBER}}</div>
          <div class="design-size">Design size: {{WIDTH}} x {{HEIGHT}}</div>
          <a class="edit-link" target="_blank" href="{{VARIANT_EDIT_LINK}}">Edit in Sivi Studio</a>
        </div>
      </div>

    </div>
  </div>

  <hr class="divider">

  <div class="summary">
    <h2>Summary</h2>
    <p>{{SUMMARY_TEXT}}</p>
  </div>

  <div class="footer">
    Generated with <a href="https://sivi.ai">Sivi</a>

</div>
</body>
</html>
